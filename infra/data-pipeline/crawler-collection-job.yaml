apiVersion: batch/v1
kind: Job
metadata:
  name: crawler-collection-prepared
  namespace: fitzza
  annotations:
    fitzza.io/execution-policy: manual-approval-required
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitzza-crawler
    spec:
      serviceAccountName: fitzza-crawler
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crawler
          image: 414901227428.dkr.ecr.ap-northeast-2.amazonaws.com/fitzza/crawler:prepared-20261021-01
          command: ["python", "-m", "src.cloud_batch"]
          # Deliberately omit --execute-approved-run. Unsuspending alone must not collect.
          args: ["--bucket", "fitzza-prod-foundation-databucket-wwng6wfc0hqy", "--run-id", "collection-20261022-01", "--category", "상의", "--stage", "discover"]
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: HOME
              value: /work
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
