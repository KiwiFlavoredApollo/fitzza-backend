apiVersion: v1
kind: ServiceAccount
metadata:
  name: fitzza-curator
  namespace: fitzza
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: data-curation-prepared
  namespace: fitzza
  annotations:
    fitzza.io/execution-policy: manual-approval-required
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitzza-crawler
    spec:
      serviceAccountName: fitzza-curator
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curator
          image: 414901227428.dkr.ecr.ap-northeast-2.amazonaws.com/fitzza/crawler:curate-prepared-20261021-01
          command: ["python", "-m", "src.cloud_curate"]
          # Execution approval is intentionally omitted, independently of suspend.
          args: ["--bucket", "fitzza-prod-foundation-databucket-wwng6wfc0hqy", "--run-id", "collection-20261022-01"]
          env:
            - name: AWS_REGION
              value: ap-northeast-2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
