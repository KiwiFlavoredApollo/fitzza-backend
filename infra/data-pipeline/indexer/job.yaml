apiVersion: v1
kind: ServiceAccount
metadata:
  name: fitzza-indexer
  namespace: fitzza
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fashion-clip-indexer-prepared
  namespace: fitzza
  annotations:
    fitzza.io/execution-policy: manual-approval-required
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitzza-indexer
        fitzza.io/qdrant-client: "true"
    spec:
      serviceAccountName: fitzza-indexer
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: 414901227428.dkr.ecr.ap-northeast-2.amazonaws.com/fitzza/fashion-clip:prepared-20261021-02
          args: ["--bucket", "fitzza-prod-foundation-databucket-wwng6wfc0hqy", "--run-id", "collection-20261022-01"]
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: QDRANT_URL
              value: http://qdrant.fitzza.svc.cluster.local:6333
            - name: HOME
              value: /work
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "1"
              memory: 3Gi
              ephemeral-storage: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 6Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
