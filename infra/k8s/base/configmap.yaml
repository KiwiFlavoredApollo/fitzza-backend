apiVersion: v1
kind: ConfigMap
metadata:
  name: fitzza-app-config
data:
  AWS_DEFAULT_REGION: ap-northeast-2
  CONFIG_SERVER_URL: http://config-service:8888
  EUREKA_URL: http://discovery-service:8761/eureka/
  POSTGRES_HOST: CHANGE_ME_RDS_ENDPOINT
  POSTGRES_PORT: "5432"
  POSTGRES_DB: fitzza
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  VIRTUAL_TRYON_URL: http://virtual-tryon-service:8000
  RECOMMENDATION_URL: http://recommendation-service:8000
  SPRING_PROFILES_ACTIVE: prod
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: CHANGE_ME_FRONTEND_ORIGIN

