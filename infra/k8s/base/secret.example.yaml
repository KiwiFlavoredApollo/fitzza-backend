apiVersion: v1
kind: Secret
metadata:
  name: fitzza-app-secrets
  namespace: fitzza
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  # product / order 전용 DB 계정 (RDS에 스키마·역할 생성 후 설정).
  PRODUCT_POSTGRES_USER: product_service
  PRODUCT_POSTGRES_PASSWORD: CHANGE_ME
  ORDER_POSTGRES_USER: order_service
  ORDER_POSTGRES_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_AT_LEAST_32_BYTES
  COMMUNITY_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  ORDER_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  RECOMMENDATION_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  VTON_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  PRODUCT_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  REVIEW_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  RECOMMENDATION_REDIS_URL: redis://:CHANGE_ME@redis:6379/1
  VTON_REDIS_URL: redis://:CHANGE_ME@redis:6379/0

