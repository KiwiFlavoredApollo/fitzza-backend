server:
  port: 8081
spring:
  datasource:
    hikari:
      schema: user_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: user_service
        # 스키마가 없는 DB(RDS 등)에서도 서비스가 뜰 때 자기 스키마를 만든다. 로컬은 init.sql이 이미 만든다.
        hbm2ddl:
          create_namespaces: true

fitzza:
  service-tokens:
    community: ${fitzza.tokens.community}
    recommendation: ${fitzza.tokens.recommendation}
