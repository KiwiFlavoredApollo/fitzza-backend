server:
  port: 8084
spring:
  datasource:
    hikari:
      schema: community_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: community_service
        # 스키마가 없는 DB(RDS 등)에서도 서비스가 뜰 때 자기 스키마를 만든다. 로컬은 init.sql이 이미 만든다.
        hbm2ddl:
          create_namespaces: true
