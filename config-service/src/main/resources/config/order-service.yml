server:
  port: 8083
spring:
  datasource:
    hikari:
      schema: order_service
  flyway:
    enabled: true
    schemas: order_service
    default-schema: order_service
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_service
        hbm2ddl:
          create_namespaces: true
