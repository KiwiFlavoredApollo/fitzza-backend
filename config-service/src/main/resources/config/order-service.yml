server:
  port: 8083
spring:
  datasource:
    hikari:
      schema: order_service
  jpa:
    properties:
      hibernate:
        default_schema: order_service
        hbm2ddl:
          create_namespaces: true

fitzza:
  service-token: ${fitzza.tokens.order}
  service-tokens:
    community: ${fitzza.tokens.community}
    review: ${fitzza.tokens.review}
