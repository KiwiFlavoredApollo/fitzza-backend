server:
  port: 8082
spring:
  datasource:
    hikari:
      schema: product_service
  jpa:
    properties:
      hibernate:
        default_schema: product_service
        hbm2ddl:
          create_namespaces: true

fitzza:
  service-token: ${fitzza.tokens.product}
  service-tokens:
    community: ${fitzza.tokens.community}
    order: ${fitzza.tokens.order}
    recommendation: ${fitzza.tokens.recommendation}
