server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        overrides:
          jwt.secret: ${JWT_SECRET:local-development-jwt-secret-at-least-32-bytes}
          jwt.expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
          jwt.refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
          fitzza.tokens.community: ${COMMUNITY_SERVICE_TOKEN:local-development-community-service-token}
          fitzza.tokens.order: ${ORDER_SERVICE_TOKEN:local-development-order-service-token}
          fitzza.tokens.review: ${REVIEW_SERVICE_TOKEN:local-development-review-service-token}
          fitzza.tokens.recommendation: ${RECOMMENDATION_SERVICE_TOKEN:local-development-recommendation-service-token}
          fitzza.tokens.product: ${PRODUCT_SERVICE_TOKEN:local-development-product-service-token}
          fitzza.tokens.vton: ${VTON_SERVICE_TOKEN:local-development-vton-service-token}
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
