server:
  port: 8888

spring:
  config:
    import:
      - "optional:file:${FITZZA_ENV_FILE:../.env}[.properties]"
      - "optional:file:${FITZZA_ENV_FILE:./.env}[.properties]"
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
